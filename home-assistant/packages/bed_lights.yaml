# Bed lights: Withings in-bed sensor -> studio lights. Plan: docs/bed-lights-opusplan.md
# Live copy: /mnt/ssd/apps/homeassistant/packages/bed_lights.yaml on bestly-pi.
automation:
  - id: bestly_bed_out_lights_on
    alias: Bed - lights on when I get up
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.bed_withings_sleep_in_bed
        from: "on"
        to: "off"
        for: "00:00:30"
    condition:
      - condition: state
        entity_id: person.jared
        state: home
    action:
      - choose:
          # 8 PM - 1 AM: dim night light, off after 5 minutes.
          - conditions:
              - condition: time
                after: "20:00:00"
                before: "01:00:00"
            sequence:
              - service: adaptive_lighting.set_manual_control
                data:
                  entity_id: switch.adaptive_lighting_home
                  lights: light.studio
                  manual_control: true
              - service: light.turn_on
                target: { entity_id: light.studio }
                data: { brightness_pct: 2, color_temp_kelvin: 2200, transition: 2 }
              - delay: "00:05:00"
              - service: light.turn_off
                target: { entity_id: light.studio }
                data: { transition: 30 }
        # Any other time: the Adaptive Lighting setting.
        default:
          - service: adaptive_lighting.apply
            data:
              entity_id: switch.adaptive_lighting_home
              lights: light.studio
              turn_on_lights: true
              transition: 2

  - id: bestly_bed_in_lights_off
    alias: Bed - everything off when I'm back in bed
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.bed_withings_sleep_in_bed
        from: "off"
        to: "on"
        for: "00:01:00"
    action:
      # Cancel a running 5-minute night-light timer, then every light off and the music stopped.
      - service: automation.turn_off
        target: { entity_id: automation.bed_lights_on_when_i_get_up }
        data: { stop_actions: true }
      - service: automation.turn_on
        target: { entity_id: automation.bed_lights_on_when_i_get_up }
      - service: light.turn_off
        target: { entity_id: all }
        data: { transition: 30 }
      - service: media_player.media_pause
        target: { entity_id: all }
        continue_on_error: true

  # The kitchen presence sensor sees the phone from the bed (the bed is next to the kitchen),
  # so the walk-in automation is paused while the bed sensor says I'm in bed.
  - id: bestly_bed_pause_kitchen_walk_in
    alias: Bed - pause kitchen walk-in lights while I'm in bed
    mode: queued
    trigger:
      - platform: state
        entity_id: binary_sensor.bed_withings_sleep_in_bed
        to: "on"
        id: in_bed
      - platform: state
        entity_id: binary_sensor.bed_withings_sleep_in_bed
        to: "off"
        for: "00:00:30"
        id: out_of_bed
      - platform: homeassistant
        event: start
        id: start
    action:
      - if:
          - condition: state
            entity_id: binary_sensor.bed_withings_sleep_in_bed
            state: "on"
        then:
          - service: automation.turn_off
            target: { entity_id: automation.kitchen_lights_on_when_i_walk_in_natural_light }
            data: { stop_actions: true }
        else:
          - service: automation.turn_on
            target: { entity_id: automation.kitchen_lights_on_when_i_walk_in_natural_light }
