<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#132726" />
    <title>Your Turo trip</title>
    <meta name="description" content="Everything for your Turo Tesla: your phone key, where the car is, A/C buttons, and help." />
    <meta name="robots" content="noindex, nofollow" />

    <!--
      Personal Turo trip pages (/t/:token → src/pages/LaxGuest.tsx, which shows the LAX or the home-pickup look).
      Own HTML so link previews show a trip page, not the Bestly site. The splash picks the right icon:
      remembered kind first (instant), else a tiny lookup (lax_trip_kind_for). Vercel rewrites /t/* here.
    -->
    <link id="ic" rel="icon" type="image/png" sizes="180x180" href="/wallet/home/apple-touch-icon.png" />
    <link id="ati" rel="apple-touch-icon" sizes="180x180" href="/wallet/home/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Turo Trip" />
    <!-- Home Screen app: no start_url, so it opens the guest's own trip link it was added from. Needed for iPhone trip alerts. -->
    <link rel="manifest" href="/trip.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Your Turo trip" />
    <meta property="og:title" content="Your Turo trip" />
    <meta property="og:description" content="Everything for your Turo Tesla: your phone key, where the car is, A/C buttons, and help." />
    <meta property="og:image" content="https://www.bestly.tech/wallet/home/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Midcentury modern West Hollywood at dusk with palm trees" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your Turo trip" />
    <meta name="twitter:description" content="Everything for your Turo Tesla: your phone key, where the car is, A/C buttons, and help." />
    <meta name="twitter:image" content="https://www.bestly.tech/wallet/home/og.png" />

    <link rel="preconnect" href="https://rcqfqhguwpmaarseifqg.supabase.co" crossorigin />
    <style>
      html,body{background:#132726}
      #boot-splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#132726;z-index:2147483647}
      #boot-splash img{width:88px;height:88px;border-radius:20px;visibility:hidden;animation:lax-breathe 1.6s ease-in-out infinite}
      @keyframes lax-breathe{0%,100%{opacity:.6;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
      @media (prefers-reduced-motion:reduce){#boot-splash img{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"><div id="boot-splash" role="status" aria-label="Loading"><img alt="" /></div></div>
    <script>
      (function () {
        var m = location.pathname.match(/^\/t\/([^/?#]+)/), s = document.getElementById("boot-splash"), img = s && s.querySelector("img");
        if (!img) return;
        function show(kind) {
          var lax = kind === "lax", bg = lax ? "#1A1140" : "#132726";
          img.src = lax ? "/wallet/lax/apple-touch-icon.png" : "/wallet/home/loader-mcm.svg";
          var ico = lax ? "/wallet/lax/apple-touch-icon.png" : "/wallet/home/apple-touch-icon.png";
          ["ic", "ati"].forEach(function (id) { var l = document.getElementById(id); if (l) l.href = ico; });
          s.style.background = bg; document.documentElement.style.background = bg; img.style.visibility = "visible";
        }
        if (m && /^demo-/.test(m[1])) return show(/^demo-lax/.test(m[1]) ? "lax" : "home");
        var k = null;
        try { k = m && localStorage.getItem("tripkind:" + m[1]); } catch (e) {}
        if (k) return show(k);
        if (!m) return show("home");
        fetch("%VITE_SUPABASE_URL%/rest/v1/rpc/lax_trip_kind_for", {
          method: "POST", headers: { apikey: "%VITE_SUPABASE_PUBLISHABLE_KEY%", "Content-Type": "application/json" },
          body: JSON.stringify({ p_token: m[1] })
        }).then(function (r) { return r.json(); }).then(function (kind) {
          try { if (kind) localStorage.setItem("tripkind:" + m[1], kind); } catch (e) {}
          show(kind || "home");
        }).catch(function () { show("home"); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
