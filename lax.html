<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2B1A73" />
    <title>Getting your Tesla at LAX</title>
    <meta name="description" content="Pickup and return steps for your Turo trip at LAX, plus your garage QR code." />
    <meta name="robots" content="noindex, nofollow" />

    <!--
      The Turo guest page (/lax/:slug, src/pages/LaxGuest.tsx) gets its own HTML so that link previews
      (iMessage, Turo chat, WhatsApp) and the share sheet show the LAX guide, not the Bestly marketing site.
      Crawlers that build link previews don't run JavaScript, so this has to be static. Vercel rewrites
      /lax and /lax/* here. No Bestly branding on purpose.
    -->
    <link rel="icon" type="image/png" sizes="180x180" href="/wallet/lax/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/wallet/lax/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="LAX Parking" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LAX Parking" />
    <meta property="og:title" content="Getting your Tesla at LAX" />
    <meta property="og:description" content="Pickup and return steps, plus your garage QR code. Add it to Apple or Google Wallet." />
    <meta property="og:image" content="https://www.bestly.tech/wallet/lax/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LA sunset with palm trees and the LAX Theme Building" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Getting your Tesla at LAX" />
    <meta name="twitter:description" content="Pickup and return steps, plus your garage QR code." />
    <meta name="twitter:image" content="https://www.bestly.tech/wallet/lax/og.png" />

    <link rel="preconnect" href="https://rcqfqhguwpmaarseifqg.supabase.co" crossorigin />
    <style>
      html,body{background:#1A1140}
      #boot-splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1A1140;z-index:2147483647}
      #boot-splash img{width:88px;height:88px;border-radius:20px;animation:lax-breathe 1.6s ease-in-out infinite}
      @keyframes lax-breathe{0%,100%{opacity:.6;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
      @media (prefers-reduced-motion:reduce){#boot-splash img{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"><div id="boot-splash" role="status" aria-label="Loading"><img src="/wallet/lax/apple-touch-icon.png" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
