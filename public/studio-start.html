<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Get started - Bestly Studio</title>
<link rel="icon" type="image/x-icon" href="/studio-favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/studio-favicon.png">
<link rel="icon" type="image/png" sizes="512x512" href="/studio-favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/studio-apple-touch-icon.png">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F0E" media="(prefers-color-scheme: dark)">
<style>
/* TOKENS: copied verbatim from preview/index.html (:root and .dark). Light is default; dark follows the OS. */
:root{
  /* Color (light) */
  --bg:#F5F5F7;            /* page */
  --card:#FFFFFF;         /* raised surface */
  --ink:#0E1312;          /* primary text */
  --dim:#5E6B68;          /* secondary text (5.3:1 on --bg) */
  --line:#E3E7E5;         /* hairlines, decorative borders */
  --edge:#86938F;         /* borders of inputs and buttons (3:1 on white) */
  --go:#1F7F77;           /* Studio teal: fills */
  --go-ink:#FFFFFF;       /* text on --go */
  --go-text:#17695F;      /* teal used as text on --bg / --card */
  --chip:#EDF2F1;         /* quiet fill */
  --go-tint:#DCEFEC;      /* status: good / new */
  --go-tint-ink:#145A54;
  --warn:#8F5A15;         /* status: time-sensitive (text) */
  --warn-tint:#F7ECD9;
  --bar:rgba(255,255,255,.86);   /* translucent tab bar */

  /* Spacing scale */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

  /* Radius */
  --r1:12px;              /* buttons, fields, chips, thumbnails */
  --r2:20px;              /* cards, sheets, frames */
  --rp:999px;             /* pills */

  /* Type scale (px) */
  --t13:13px; --t15:15px; --t17:17px; --t20:20px; --t24:24px; --t32:32px; --t44:44px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;

  /* Elevation: two levels only */
  --e1:0 1px 2px rgba(9,20,18,.05),0 8px 24px rgba(9,20,18,.06);     /* cards */
  --e2:0 2px 6px rgba(9,20,18,.06),0 24px 60px rgba(9,20,18,.14);    /* sheets, device frames */

  /* Touch sizes */
  --hit:44px;             /* minimum target */
  --field:48px;           /* input height */
}
.dark{
  --bg:#0B0F0E; --card:#141A19; --ink:#EDF3F1; --dim:#9AA8A5; --line:#24302D; --edge:#5F6F6B;
  --go:#5FC0B6; --go-ink:#06201D; --go-text:#5FC0B6; --chip:#1B2422;
  --go-tint:#173532; --go-tint-ink:#8FE0D6; --warn:#E0AC6A; --warn-tint:#33281A;
  --bar:rgba(11,15,14,.84);
  --e1:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
  --e2:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not(.light){
  --bg:#0B0F0E; --card:#141A19; --ink:#EDF3F1; --dim:#9AA8A5; --line:#24302D; --edge:#5F6F6B;
  --go:#5FC0B6; --go-ink:#06201D; --go-text:#5FC0B6; --chip:#1B2422;
  --go-tint:#173532; --go-tint-ink:#8FE0D6; --warn:#E0AC6A; --warn-tint:#33281A;
  --bar:rgba(11,15,14,.84);
  --e1:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
  --e2:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark;
}}

/* phones: no text under 16 px (the 13/15 steps are for large screens) */
@media (max-width:700px){:root{--t13:16px;--t15:16px}}
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--bar-h:0px;--danger:#B3261E;--danger-tint:#FBE6E3}
@media (prefers-color-scheme:dark){:root{--danger:#F2A39C;--danger-tint:#3A1D1A}}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body,a,button,input,select,textarea,summary,label{touch-action:manipulation}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--t17);font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul{margin:0}
button,input,textarea,select{font-family:var(--font);font-size:var(--t17);color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;line-height:1.2}
a{color:var(--go-text)}
:focus-visible{outline:3px solid var(--go);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.nw{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:var(--s4);top:-80px;z-index:100;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--r1);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.skip:focus{top:calc(var(--sat) + 8px)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.l{width:24px;height:24px}
.ic.s{width:16px;height:16px}
[hidden]{display:none!important}
.wrapany{overflow-wrap:anywhere}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--hit);min-width:var(--hit);padding:0 var(--s5);border-radius:var(--r1);border:1px solid transparent;background:var(--go);color:var(--go-ink);font-weight:600;font-size:var(--t17);line-height:1.1;white-space:nowrap;text-decoration:none;transition:transform .12s ease-out,opacity .12s}
.btn:active{transform:scale(.98)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn .ic.b{margin-right:var(--s2)}
.btn .ic.a{margin-left:var(--s2)}
.btn.lg{min-height:56px}
.btn.out{background:transparent;color:var(--ink);border-color:var(--edge)}
.btn.quiet{background:transparent;color:var(--go-text);padding:0 var(--s3)}
.btn.danger{background:var(--danger);color:#fff}
.btn.dangerout{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.block{width:100%}
.btn.wrap{white-space:normal;text-align:center;padding-top:10px;padding-bottom:10px}
.chip{display:inline-block;line-height:28px;height:28px;padding:0 var(--s3);border-radius:var(--rp);background:var(--chip);color:var(--ink);font-size:var(--t13);font-weight:600;white-space:nowrap}
.chip.new{background:var(--go-tint);color:var(--go-tint-ink)}
.chip.soon{background:var(--chip);color:var(--dim)}
.chip.open{background:var(--warn-tint);color:var(--warn)}
.chip.sold{background:var(--ink);color:var(--bg)}
.chip.ok{background:var(--go-tint);color:var(--go-tint-ink)}

/* ---------- fields ---------- */
.field{display:block}
.field>span,.lbl{display:block;font-size:var(--t15);font-weight:600;color:var(--dim);margin-bottom:4px}
.in{display:block;width:100%;height:var(--field);padding:0 14px;border:1px solid var(--edge);border-radius:var(--r1);background:var(--card);color:var(--ink);font-size:var(--t17);line-height:1.2;-webkit-appearance:none;appearance:none}
textarea.in{height:auto;min-height:96px;padding:12px 14px;line-height:1.4;resize:vertical}
select.in{background-image:none;padding-right:14px}
.in:focus{outline:none;border-color:var(--go);box-shadow:0 0 0 4px rgba(31,127,119,.22)}
.in.bad{border-color:var(--danger)}
.help{margin-top:4px;font-size:var(--t15);line-height:1.4;color:var(--dim)}
.err{margin-top:6px;font-size:var(--t15);line-height:1.4;color:var(--danger);font-weight:500}
.seg{display:inline-flex;padding:4px;gap:4px;border-radius:var(--r1);background:var(--chip)}
.seg button{display:inline-flex;align-items:center;justify-content:center;min-height:var(--hit);padding:0 var(--s4);border-radius:8px;font-size:var(--t15);font-weight:600;color:var(--dim);white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(9,20,18,.12)}
.sgm{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.sgm button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:var(--field);border:1px solid var(--edge);border-radius:var(--r1);background:var(--card);font-size:var(--t17);font-weight:500;padding:0 6px}
.sgm button[aria-checked="true"]{background:var(--go);border-color:var(--go);color:var(--go-ink);font-weight:600}
.chk{display:flex;gap:var(--s3);align-items:flex-start;min-height:var(--hit);font-size:var(--t15);line-height:1.45;color:var(--ink);cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;flex:none;width:28px;height:28px;margin:0;border:1.5px solid var(--edge);border-radius:8px;background:var(--card);display:grid;place-items:center;cursor:pointer}
.chk input:checked{background:var(--go);border-color:var(--go)}
.chk input:checked::after{content:"";width:7px;height:13px;border:solid var(--go-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.chk.bad input{border-color:var(--danger)}
/* switch rows */
.sw{display:flex;align-items:center;gap:var(--s4);width:100%;min-height:64px;padding:var(--s3) var(--s4);text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r1)}
.sw .tx{flex:1;min-width:0}
.sw .tx b{display:block;font-size:var(--t17);font-weight:600;line-height:1.3}
.sw .tx small{display:block;margin-top:2px;font-size:var(--t15);line-height:1.4;color:var(--dim)}
.knob{position:relative;flex:none;width:51px;height:31px;border-radius:99px;background:var(--edge);transition:background .2s}
.knob::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked="true"] .knob{background:var(--go)}
.sw[aria-checked="true"] .knob::after{transform:translateX(20px)}
.sw .st{flex:none;min-width:32px;font-size:var(--t15);font-weight:600;color:var(--dim)}
.pick{display:inline-flex;align-items:center;gap:6px;min-height:var(--hit);padding:0 var(--s4);border:1px solid var(--edge);border-radius:var(--rp);background:var(--card);font-weight:500;font-size:var(--t17)}
.pick[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:var(--go-ink);font-weight:600}
.picks{display:flex;flex-wrap:wrap;gap:var(--s2)}

/* ---------- placeholder art (feathered) ---------- */
.ph{position:relative;background:radial-gradient(70% 55% at 28% 22%,var(--hi),transparent 72%),radial-gradient(90% 70% at 80% 92%,var(--lo),transparent 78%),linear-gradient(160deg,var(--a),var(--b))}
.ph::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 45%,transparent 52%,rgba(0,0,0,.26) 100%);pointer-events:none}
.p1{--a:#86B4DD;--b:#CDB48C;--hi:#FFF1CF;--lo:#6B7A4E}
.p2{--a:#E8D9C3;--b:#B58F6A;--hi:#FFFFFF;--lo:#6B4A33}
.p3{--a:#C8D3D9;--b:#8F9FA6;--hi:#FFFFFF;--lo:#4B5A62}
.p4{--a:#F0B78C;--b:#6A5B8A;--hi:#FFE3B8;--lo:#2F2A4D}
.p5{--a:#BFD6A8;--b:#6F9163;--hi:#F4F9E0;--lo:#2F4A36}
.p6{--a:#E6DAD6;--b:#B7A39C;--hi:#FFFFFF;--lo:#7A6159}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--r1);background:rgba(10,14,13,.62);color:#fff;font-size:var(--t13);font-weight:600;line-height:1.25;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* ---------- callouts, spinner ---------- */
.note{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);border-radius:var(--r1);background:var(--go-tint);color:var(--go-tint-ink);font-size:var(--t15);line-height:1.45}
.note .ic{margin-top:2px}
.note.warn{background:var(--warn-tint);color:var(--warn)}
.note.bad{background:var(--danger-tint);color:var(--danger)}
.note.plain{background:var(--chip);color:var(--ink)}
.spin{width:40px;height:40px;fill:none;stroke:var(--go);stroke-width:2.5;stroke-linecap:round;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mid{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s4);padding:var(--s7) var(--s4)}
.mid h1,.mid h2{font-size:var(--t24);line-height:1.2;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.mid p{color:var(--dim);max-width:30em}
.bigic{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--go-tint);color:var(--go-tint-ink)}
.bigic .ic{width:32px;height:32px}

/* ---------- toasts ---------- */
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--bar-h) + var(--sab) + 12px);padding:0 calc(var(--s4) + var(--sar)) 0 calc(var(--s4) + var(--sal));display:flex;flex-direction:column;align-items:center;gap:var(--s2);pointer-events:none;z-index:70}
.toast{pointer-events:auto;max-width:480px;background:var(--ink);color:var(--bg);border-radius:var(--r1);padding:12px 16px;box-shadow:var(--e2);font-size:var(--t15);font-weight:500;line-height:1.4;animation:tin .2s ease-out}
.toast.bad{background:var(--danger);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,19,18,.4);opacity:0;transition:opacity .2s;z-index:50}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:51;left:0;right:0;bottom:0;max-height:94vh;max-height:94dvh;background:var(--card);color:var(--ink);border-radius:var(--r2) var(--r2) 0 0;box-shadow:var(--e2);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease-out;padding-left:var(--sal);padding-right:var(--sar)}
.sheet.on{transform:none}
.sheet .shd{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s3) var(--s5) 0}
.sheet .shd h2{font-size:var(--t24);font-weight:600;letter-spacing:-.015em;line-height:1.2}
.sheet .sbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:var(--s3) var(--s5) var(--s4);display:grid;gap:var(--s3);align-content:start}
.sheet .sact{padding:var(--s3) var(--s5) calc(var(--s4) + var(--sab));display:grid;gap:var(--s2);border-top:1px solid var(--line)}
.xbtn{flex:none;display:grid;place-items:center;width:var(--hit);height:var(--hit);margin-right:-10px;border-radius:50%;color:var(--dim)}
@media (min-width:1024px){
  .sheet{left:auto;top:0;width:480px;max-height:none;border-radius:0;transform:translateX(100%)}
  .sheet.on{transform:none}
}

/* ---------- uploader ---------- */
.drop{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;width:100%;min-height:132px;justify-content:center;padding:var(--s4);border:2px dashed var(--go);border-radius:var(--r2);background:radial-gradient(80% 90% at 50% 40%,rgba(31,127,119,.16),rgba(31,127,119,0) 100%),var(--chip);color:var(--ink)}
.drop.over{border-style:solid}
.drop .up{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--go);color:var(--go-ink);margin-bottom:2px}
.drop b{text-wrap:balance;font-size:var(--t17);font-weight:600;line-height:1.35}
.drop small{font-size:var(--t15);color:var(--dim);line-height:1.4}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--s2)}
.ut{position:relative;aspect-ratio:1;border-radius:var(--r1);overflow:hidden;background:var(--chip);display:grid;place-items:center}
.ut img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ut .gen{display:grid;justify-items:center;gap:2px;color:var(--dim);font-size:var(--t15);font-weight:600;padding:4px;text-align:center}
.ut .rm{position:absolute;top:0;right:0;width:44px;height:44px;display:grid;place-items:center;z-index:3}
.ut .rm i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(10,14,13,.66);color:#fff}
.ut .rm .ic{width:16px;height:16px}
.ut .bar{position:absolute;left:8px;right:8px;bottom:8px;height:5px;border-radius:99px;background:rgba(255,255,255,.55);z-index:2;overflow:hidden}
.ut .bar i{display:block;height:100%;width:100%;transform-origin:left center;transform:scaleX(var(--p,0));background:var(--go);border-radius:99px;transition:transform .15s linear}
.ut .pc{position:absolute;left:6px;top:6px;z-index:2;padding:2px 8px;border-radius:99px;background:rgba(10,14,13,.66);color:#fff;font-size:var(--t15);font-weight:600;line-height:1.4}
.ut .ck{position:absolute;left:6px;bottom:6px;z-index:2;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--go);color:var(--go-ink)}
.ut .ck .ic{width:14px;height:14px;stroke-width:2.5}
.ut.bad{background:var(--danger-tint)}
.ut .retry{position:absolute;inset:0;z-index:4;display:grid;place-content:center;justify-items:center;gap:4px;padding:6px;color:var(--danger);font-weight:600;font-size:var(--t15);line-height:1.25;text-align:center;background:var(--danger-tint)}
.tcount{font-size:var(--t15);color:var(--dim)}
.f4{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.f4 .in{padding:0 10px;white-space:nowrap}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.fcs{display:grid;grid-template-columns:1.4fr .7fr 1fr;gap:var(--s2)}
.fcs .in{padding:0 10px;white-space:nowrap}
.lform{display:grid;gap:var(--s3)}

/* progress bar (single file) */
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:100%;transform-origin:left center;transform:scaleX(var(--p,0));background:var(--go);border-radius:99px;transition:transform .15s linear}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .spin{animation:none}
}


/* ---------- wizard ---------- */
:root{--bar-h:96px}
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.wtop{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);max-width:608px;width:100%;margin:0 auto;padding:calc(var(--sat) + var(--s2)) calc(var(--s5) + var(--sar)) 0 calc(var(--s5) + var(--sal))}
.back{display:inline-flex;align-items:center;gap:2px;min-height:var(--hit);min-width:var(--hit);margin-left:-10px;padding:0 10px 0 4px;color:var(--go-text);font-size:var(--t17);font-weight:500}
.back[hidden]{display:inline-flex!important;visibility:hidden}
.saved{flex:1;text-align:center;font-size:var(--t15);color:var(--dim);min-height:24px}
.count{font-size:var(--t17);font-weight:600;color:var(--dim);text-align:right;min-width:64px}
.prog{max-width:560px;width:calc(100% - 48px - var(--sal) - var(--sar));margin:2px auto 0;height:6px;border-radius:var(--rp);background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:100%;transform-origin:left center;transform:scaleX(var(--p,0));border-radius:var(--rp);background:var(--go);transition:transform .3s ease-out}
.wiz{flex:1;width:100%;max-width:608px;margin:0 auto;padding:var(--s5) calc(var(--s5) + var(--sar)) var(--s5) calc(var(--s5) + var(--sal))}
.screen{animation:sin .22s ease-out}
@keyframes sin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wiz h1{text-wrap:balance;font-size:var(--t32);line-height:1.12;font-weight:600;letter-spacing:-.022em;overflow-wrap:break-word}
.sub{margin-top:var(--s3);color:var(--dim);font-size:var(--t17);line-height:1.45}
.form{display:grid;gap:var(--s4);margin-top:var(--s5)}
.dock{position:sticky;bottom:0;z-index:4;pointer-events:none;padding:var(--s6) calc(var(--s5) + var(--sar)) calc(var(--s4) + var(--sab)) calc(var(--s5) + var(--sal));background:linear-gradient(to top,var(--bg) 58%,transparent)}
.dock>div{max-width:560px;margin:0 auto;display:grid;gap:var(--s2);pointer-events:auto}
.dmsg{font-size:var(--t15);line-height:1.4;color:var(--dim);text-align:center}

function passkeyLabel() {

  if (/iPhone|iPad|iPod/.test(ua) || (pf === "MacIntel" && navigator.maxTouchPoints > 1)) return "Save with Face ID";
  if (/Macintosh|MacIntel|Mac OS X/.test(ua + " " + pf)) return "Save with Touch ID";
  return "Save a passkey";
}
function pkOptions(res) {
  const o = res.publicKey || res.options || res;
  const pk = Object.assign({}, o);
  pk.challenge = b64u.dec(o.challenge);
  if (o.user && o.user.id) pk.user = Object.assign({}, o.user, { id: b64u.dec(o.user.id) });
  ["excludeCredentials", "allowCredentials"].forEach((k) => {
    if (o[k]) pk[k] = o[k].map((c) => Object.assign({}, c, { id: b64u.dec(c.id) }));
  });
  return pk;
}
function pkCred(c) {
  const r = c.response, out = { id: c.id, rawId: b64u.enc(c.rawId), type: c.type, clientExtensionResults: (c.getClientExtensionResults && c.getClientExtensionResults()) || {}, response: {} };
  if (r.attestationObject) { out.response.clientDataJSON = b64u.enc(r.clientDataJSON); out.response.attestationObject = b64u.enc(r.attestationObject); if (r.getTransports) out.response.transports = r.getTransports(); }
  else { out.response.clientDataJSON = b64u.enc(r.clientDataJSON); out.response.authenticatorData = b64u.enc(r.authenticatorData); out.response.signature = b64u.enc(r.signature); if (r.userHandle) out.response.userHandle = b64u.enc(r.userHandle); }
  return out;
}
async function savePasskey(token) {
  const o = await api("passkey_options", { token: token });
  if (!o.ok) return o;
  let cred;
  try { cred = await navigator.credentials.create({ publicKey: pkOptions(o) }); }
  catch (e) { return { ok: false, cancelled: true, error: "cancelled", message: "No problem. You can add a passkey any time in Settings." }; }
  if (!cred) return { ok: false, cancelled: true, message: "No problem. You can add a passkey any time in Settings." };
  return api("passkey_save", { token: token, credential: pkCred(cred) });
}
async function loginPasskey(email) {
  const o = await api("passkey_login_options", { email: email });
  if (!o.ok) return o;
  let cred;
  try { cred = await navigator.credentials.get({ publicKey: pkOptions(o) }); }
  catch (e) { return { ok: false, cancelled: true, message: "That did not go through. You can use the email link instead." }; }
  if (!cred) return { ok: false, cancelled: true, message: "That did not go through. You can use the email link instead." };
  return api("passkey_login", { credential: pkCred(cred) });
}

/* ===== autosave: debounce 500 ms, one request in flight, patch + rev, stale_rev re-apply ===== */
function Saver(o) {
  const S = {
    answers: {}, rev: 0, ver: {}, dirty: new Set(), stepDirty: false,
    inflight: null, again: false, timer: null, retry: null, fails: 0, hold: false
  };
  function state(k, msg) { if (o.onState) o.onState(k, msg); }
  S.init = function (answers, rev) { S.answers = answers || {}; S.rev = Number(rev) || 0; };
  S.get = function (g, k, d) { const x = S.answers[g]; return x && x[k] != null ? x[k] : d; };
  S.set = function (g, k, v) {
    const x = S.answers[g] = S.answers[g] || {};
    x[k] = v; S.touch(g);
  };
  S.setGroup = function (g, obj) { S.answers[g] = obj; S.touch(g); };
  S.touch = function (g) { S.ver[g] = (S.ver[g] || 0) + 1; S.dirty.add(g); S.hold = false; S.schedule(); };
  S.touchStep = function () { S.stepDirty = true; S.hold = false; S.schedule(); };
  S.schedule = function (ms) {
    clearTimeout(S.timer); clearTimeout(S.retry); S.retry = null;
    S.timer = setTimeout(() => S.flush(), ms == null ? 500 : ms);
  };
  S.flush = function (keepalive) {
    clearTimeout(S.timer);
    if (S.inflight) { S.again = true; return S.inflight; }
    const token = o.getToken();
    if (!token || (!S.dirty.size && !S.stepDirty)) return Promise.resolve();
    const groups = Array.from(S.dirty), vers = groups.map((g) => S.ver[g]);
    const patch = {};
    groups.forEach((g) => { patch[g] = JSON.parse(JSON.stringify(S.answers[g] == null ? {} : S.answers[g])); });
    const step = o.getStep(), sd = S.stepDirty;
    state("saving");
    S.inflight = (async () => {
      const r = await api("save", { token: token, step: step, patch: patch, rev: S.rev }, { keepalive: !!keepalive });
      if (r.ok) {
        S.rev = r.rev != null ? r.rev : S.rev; S.fails = 0;
        groups.forEach((g, i) => { if (S.ver[g] === vers[i]) S.dirty.delete(g); });
        if (sd && step === o.getStep()) S.stepDirty = false;
        state("saved");
      } else if (r.error === "stale_rev") {
        /* another device saved first: take the server copy, lay our unsaved groups back on top, send again */
        const rr = await api("resume", { token: token });
        if (rr.ok) {
          const local = S.answers, merged = Object.assign({}, rr.answers || {});
          const plain = (x) => x && typeof x === "object" && !Array.isArray(x);
          S.dirty.forEach((g) => { merged[g] = plain(local[g]) && plain(merged[g]) ? Object.assign({}, merged[g], local[g]) : local[g]; });
          S.answers = merged; S.rev = Number(rr.rev) || 0; S.again = true;
          if (o.onMerged) o.onMerged(rr);
        } else if (rr.error === "not_signed_in") { o.onSignedOut(); }
        else {
          state("error", rr.message);
          if (rr.error === "offline" || rr.error === "server_error") S.retry = setTimeout(() => S.flush(), 5000); else S.hold = true;
        }
      } else if (r.error === "not_signed_in") {
        o.onSignedOut();
      } else {
        S.fails++;
        state("error", r.message);
        if (r.error === "offline" || r.error === "server_error") S.retry = setTimeout(() => S.flush(), Math.min(30000, 3000 * Math.pow(2, S.fails - 1)));
        else S.hold = true; /* a refusal: wait for the next edit instead of looping (old bug 4) */
      }
    })().finally(() => {
      S.inflight = null;
      if (S.again) { S.again = false; if (!S.hold) S.flush(); }
      else if ((S.dirty.size || S.stepDirty) && !S.retry && !S.hold) S.schedule();
    });
    return S.inflight;
  };
  /* flush when the page is hidden or closed */
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") S.flush(true); });
  window.addEventListener("pagehide", () => S.flush(true));
  return S;
}

/* ===== uploads: one component for the wizard and the board ===== */
const EXT_MIME = { jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", heic: "image/heic", heif: "image/heic", webp: "image/webp", zip: "application/zip" };
function mimeOf(f) {
  if (f.type && f.type !== "application/octet-stream") return f.type === "application/x-zip-compressed" ? "application/zip" : f.type;
  const m = /\.([a-z0-9]+)$/i.exec(f.name || ""); return (m && EXT_MIME[m[1].toLowerCase()]) || "";
}
const CAPS = { photo: 25, logo: 8, headshot: 8, zip: 50 };

/* PUT with progress; resolves {ok} */
function putFile(url, method, headers, file, onProgress) {
  return new Promise((resolve) => {
    const x = new XMLHttpRequest();
    x.open(method || "PUT", url, true);
    Object.keys(headers || {}).forEach((k) => x.setRequestHeader(k, headers[k]));
    x.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => resolve({ ok: x.status >= 200 && x.status < 300 });
    x.onerror = () => resolve({ ok: false, offline: true });
    x.ontimeout = () => resolve({ ok: false, offline: true });
    x.timeout = 180000;
    x.send(file);
  });
}
async function uploadOne(token, kind, file, onProgress) {
  const mime = mimeOf(file);
  if (!mime) return { ok: false, message: "That file type is not supported. Use JPEG, PNG, HEIC, WebP or a zip." };
  if (file.size > CAPS[kind] * 1048576) return { ok: false, message: "That file is bigger than " + CAPS[kind] + " MB." };
  const u = await api("upload_url", { token: token, kind: kind, filename: file.name || "photo", mime: mime, size: file.size });
  if (!u.ok) return u;
  const p = await putFile(u.url, u.method, u.headers, file, onProgress);
  if (!p.ok) return { ok: false, message: p.offline ? OFFLINE : "That upload did not finish. Try again." };
  return { ok: true, path: u.path };
}

/* single-file picker (logo, headshot) with progress */

      thumb.hidden = true; msg.textContent = r.message || GENERIC; msg.className = "err"; msg.hidden = false;

  const el = h("div", { class: "lform" },

/* multi-photo uploader: files + zip, up to 60, thumbnails, per-file progress, remove >= 44 px */
function PhotoUploader(o) {
  /* o: {getToken, max=60, onChange(), onSignedOut()} */
  const max = o.max || 60;
  const items = []; let active = 0;
  const input = h("input", { type: "file", multiple: true, accept: "image/jpeg,image/png,image/heic,image/webp,.heic,.heif,.zip,application/zip", class: "sr", tabindex: "-1", "aria-hidden": "true" });
  const drop = h("button", { type: "button", class: "drop", "aria-label": "Add listing photos" },
    h("span", { class: "up", "aria-hidden": "true" }, ic("up", "l")),
    h("b", { text: "Drop the listing photos here, or tap to choose." }),
    h("small", null, "Up to ", nwSpan(max + " photos"), ". JPEG, PNG, HEIC, or a zip."));
  const grid = h("div", { class: "ugrid", role: "list", "aria-label": "Photos added", hidden: true });
  const count = h("p", { class: "tcount", "aria-live": "polite" });
  const msg = h("p", { class: "err", hidden: true, role: "alert" });
  const el = h("div", { class: "lform" }, drop, input, msg, grid, count);

  function say(t) { msg.textContent = t || ""; msg.hidden = !t; }
  function photoCount() { return items.filter((i) => !i.zip).length; }
  function refresh() {
    grid.hidden = !items.length;
    const busy = items.filter((i) => i.status === "up" || i.status === "q").length;
    count.replaceChildren();
    if (items.length) {
      const bits = [];
      if (photoCount()) bits.push(plural(photoCount(), "photo") + " added");
      if (items.some((i) => i.zip)) bits.push("a zip added");
      if (busy) bits.push(busy + " still uploading");
      count.appendChild(nwify(bits.join(", ")));
    }
    if (o.onChange) o.onChange();
  }
  function tile(it) {
    const t = it.node;
    t.className = "ut" + (it.status === "err" ? " bad" : "");
    t.replaceChildren();
    const generic = () => h("span", { class: "gen" }, ic(it.zip ? "file" : "image", "l"), it.zip ? "Zip file" : "Photo");
    if (it.preview) {
      const im = h("img", { src: it.preview, alt: "", loading: "lazy" });
      im.addEventListener("error", () => { im.remove(); t.insertBefore(generic(), t.firstChild); });
      t.appendChild(im);
    } else t.appendChild(generic());
    if (it.status === "up" || it.status === "q") {
      t.appendChild(h("span", { class: "pc" }, nwSpan(Math.round((it.pct || 0) * 100) + "%")));
      const b = h("span", { class: "bar" }, h("i")); b.firstChild.style.setProperty("--p", it.pct || 0); t.appendChild(b);
    } else if (it.status === "done") {
      t.appendChild(h("span", { class: "ck", role: "img", "aria-label": "Uploaded" }, ic("check")));
    } else if (it.status === "err") {
      t.appendChild(h("button", { type: "button", class: "retry", "aria-label": "Try again. " + (it.msg || "The upload failed."), onclick: () => { it.status = "q"; it.pct = 0; tile(it); pump(); } },
        ic("refresh"), h("span", { text: "Try again" })));
    }
    t.appendChild(h("button", { type: "button", class: "rm", "aria-label": "Remove " + (it.zip ? "zip file" : "photo " + (items.indexOf(it) + 1)), onclick: () => remove(it) }, h("i", null, ic("x"))));
  }
  function remove(it) {
    const i = items.indexOf(it); if (i < 0) return;
    items.splice(i, 1); it.node.remove(); it.removed = true;
    if (it.preview) URL.revokeObjectURL(it.preview);
    say(""); refresh();
  }
  async function run(it) {
    it.status = "up"; tile(it); active++;
    const r = await uploadOne(o.getToken(), it.zip ? "zip" : "photo", it.file, (p) => {
      it.pct = p; const bar = $(".bar i", it.node), pc = $(".pc .nw", it.node);
      if (bar) bar.style.setProperty("--p", p);
      if (pc) pc.textContent = Math.round(p * 100) + "%";
    });
    active--;
    if (it.removed) { pump(); return; }
    if (r.ok) { it.status = "done"; it.path = r.path; it.pct = 1; }
    else { it.status = "err"; it.msg = r.message || GENERIC; if (r.error === "not_signed_in" && o.onSignedOut) o.onSignedOut(); }
    tile(it); refresh(); pump();
  }
  function pump() { items.forEach((it) => { if (it.status === "q" && active < 3) run(it); }); }
  function addFiles(list) {
    say("");
    const files = Array.prototype.slice.call(list || []);
    let skipped = 0, bad = 0;
    files.forEach((f) => {
      const mime = mimeOf(f), zip = mime === "application/zip";
      if (!mime) { bad++; return; }
      if (!zip && photoCount() >= max) { skipped++; return; }
      const it = { file: f, zip: zip, status: "q", pct: 0, node: h("div", { class: "ut", role: "listitem" }) };
      if (!zip && /^image\/(jpeg|png|webp)$/.test(mime)) it.preview = URL.createObjectURL(f);
      items.push(it); grid.appendChild(it.node); tile(it);
    });
    if (skipped) say("Only " + max + " photos per listing. We kept the first " + max + ".");
    else if (bad) say("Some files were skipped. Use JPEG, PNG, HEIC, WebP or a zip.");
    refresh(); pump();
  }
  drop.addEventListener("click", () => input.click());
  input.addEventListener("change", () => { addFiles(input.files); input.value = ""; });
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => { if (e.dataTransfer) addFiles(e.dataTransfer.files); });
  return {
    el: el,
    busy: () => items.some((i) => i.status === "up" || i.status === "q"),
    failed: () => items.some((i) => i.status === "err"),
    count: () => items.filter((i) => i.status === "done").length,
    any: () => items.length > 0,
    photos: () => items.filter((i) => i.status === "done").map((i, n) => i.zip ? { path: i.path, position: n, kind: "zip" } : { path: i.path, position: n, name: (i.file && i.file.name) || undefined }),
    reset: () => { items.splice(0).forEach((i) => { if (i.preview) URL.revokeObjectURL(i.preview); i.removed = true; }); grid.replaceChildren(); say(""); refresh(); },
    addFiles: addFiles
  };
}

/* money input: shows $1,295,000 while typing, keeps the caret next to the same digit, value is read back with the non-digits stripped */
function moneyField(input) {
  input.addEventListener("input", () => {
    const raw = input.value, pos = input.selectionStart == null ? raw.length : input.selectionStart;
    const before = raw.slice(0, pos).replace(/\D/g, "").length;
    const d = raw.replace(/\D/g, "").replace(/^0+(?=\d)/, "").slice(0, 9);
    const out = d ? "$" + Number(d).toLocaleString("en-US") : "";
    if (out === raw) return;
    input.value = out;
    let seen = 0, np = out.length;
    if (before === 0) np = out ? 1 : 0;
    else for (let i = 0; i < out.length; i++) { if (/\d/.test(out[i])) seen++; if (seen === before) { np = i + 1; break; } }
    try { input.setSelectionRange(np, np); } catch (e) {}
  });
}

/* listing form: address, city/state/zip, price, beds/baths/sq ft (one row), notes, attestation */
const ATTEST = "I own these photos or have written permission to edit them and make videos from them, and I have the owner's OK to advertise this listing.";
const STATUS_LABELS = { coming_soon: "Coming soon", just_listed: "Just listed", open_house: "Open house", price_change: "Price change", pending: "Pending", sold: "Sold" };
function ListingForm(o) {
  /* o: {withStatus, getToken, onChange(), onSignedOut()} */
  const err = h("p", { class: "err", role: "alert", hidden: true });
  const ch = () => { if (!err.hidden) err.hidden = true; if (o.onChange) o.onChange(); };
  const up = PhotoUploader({ getToken: o.getToken, onChange: ch, onSignedOut: o.onSignedOut });
  function inp(label, id, extra) { const i = h("input", Object.assign({ class: "in", id: id, type: "text", autocomplete: "off" }, extra || {})); i.addEventListener("input", ch); return i; }
  function wrap(label, input, help) { return h("label", { class: "field", for: input.id }, h("span", { text: label }), input, help ? h("p", { class: "help", text: help }) : null); }
  const address = inp("Address", "lf-address", { autocomplete: "street-address", placeholder: "4127 SE Hawthorne Blvd" });
  const city = inp("City", "lf-city", { autocomplete: "address-level2" });
  const state = inp("State", "lf-state", { autocomplete: "address-level1", maxlength: 2, autocapitalize: "characters", placeholder: "OR" });
  const zip = inp("ZIP", "lf-zip", { autocomplete: "postal-code", inputmode: "numeric", maxlength: 10 });
  const price = inp("Price", "lf-price", { inputmode: "numeric", placeholder: "$1,295,000", autocomplete: "off" });
  moneyField(price);
  const beds = inp("Beds", "lf-beds", { inputmode: "decimal" });
  const baths = inp("Baths", "lf-baths", { inputmode: "decimal" });
  const sqft = inp("Sq ft", "lf-sqft", { inputmode: "numeric" });
  const notes = h("textarea", { class: "in", id: "lf-notes", rows: 3, placeholder: "Open house times, upgrades, extras." });
  notes.addEventListener("input", ch);
  const status = h("select", { class: "in", id: "lf-status" });
  Object.keys(STATUS_LABELS).forEach((k) => status.appendChild(h("option", { value: k, text: STATUS_LABELS[k] })));
  status.value = "just_listed";
  const oh = h("input", { class: "in", id: "lf-oh", type: "datetime-local" });
  const ohWrap = wrap("Open house date and time", oh); ohWrap.hidden = true;
  status.addEventListener("change", () => { ohWrap.hidden = status.value !== "open_house"; ch(); });
  const att = h("input", { type: "checkbox", id: "lf-att" });
  const attLbl = h("label", { class: "chk", for: "lf-att" }, att, h("span", { text: ATTEST }));
  att.addEventListener("change", () => { attLbl.classList.remove("bad"); ch(); });
  const el = h("div", { class: "lform" },
    up.el, wrap("Address", address),
    h("div", { class: "fcs" }, wrap("City", city), wrap("State", state), wrap("ZIP", zip)),
    wrap("Price", price),
    h("div", { class: "f4" }, wrap("Beds", beds), wrap("Baths", baths), wrap("Sq ft", sqft)),
    o.withStatus ? wrap("Status", status) : null, o.withStatus ? ohWrap : null,
    wrap("Notes", notes), attLbl, err);
  function touched() { return !!(up.any() || address.value.trim() || city.value.trim() || price.value.trim() || notes.value.trim()); }
  function problems() {
    const p = [];
    if (up.busy()) p.push("Wait for the photos to finish uploading.");
    else if (up.failed()) p.push("A photo did not upload. Tap Try again on it, or remove it.");
    else if (!up.count()) p.push("Add at least one photo.");
    if (!address.value.trim()) p.push("Add the street address.");
    if (!att.checked) { p.push("Tick the box to confirm you have the rights to these photos."); attLbl.classList.add("bad"); }
    return p;
  }
  function value() {
    const L = {
      address: address.value.trim(), city: city.value.trim(), state: state.value.trim().toUpperCase(), zip: zip.value.trim(),
      price_usd: Number(String(price.value).replace(/\D/g, "")) || null, beds: Number(digits(beds.value)) || null, baths: Number(digits(baths.value)) || null,
      sqft: Number(digits(sqft.value)) || null, notes: notes.value.trim(), status: o.withStatus ? status.value : "just_listed"
    };
    if (o.withStatus && status.value === "open_house" && oh.value) L.open_house_at = new Date(oh.value).toISOString();
    return L;
  }
  /* listing_save is called only when attested (and everything else is in place) */
  async function submit(token) {
    const p = problems();
    if (p.length) { err.textContent = p.join(" "); err.hidden = false; return { ok: false, local: true, message: p.join(" ") }; }
    err.hidden = true;
    const r = await api("listing_save", { token: token, listing: value(), photos: up.photos(), attested: true });
    if (!r.ok) { err.textContent = r.message; err.hidden = false; }

  }
  function reset() {
    [address, city, state, zip, price, beds, baths, sqft, notes, oh].forEach((i) => { i.value = ""; });

    mid("", "Signing you in", "One second. Your work is already saved.", null, true);
    const r = await api("verify", { code: code.trim().toLowerCase() });
    if (r.ok) return afterAuth(r);
    if (r.error === "offline" || r.error === "server_error") return offlineScreen(r.message);
    return expiredScreen(r.message);
  }
  if (S.token) {
    mid("", "Opening your sign-up", "One second. Your work is already saved.", null, true);
    const r = await api("resume", { token: S.token });
    if (r.ok) {
      if (rightDoor(r.vertical)) return; saver.init(r.answers, r.rev); S.email = r.email || S.email; S.clientSlug = r.client_slug || ""; S.conn = r.connections || {}; if (Array.isArray(r.networks) && r.networks.length) NETS = r.networks;
      if (P.get("step") === "brand" && S.clientSlug) { S.edit = true; return go("brand"); }
      if (P.get("cancelled")) { S.note = "No problem. You were not charged. Pick a plan whenever you are ready."; history.replaceState(null, "", location.pathname); return go("plan"); }
      if (P.get("connected")) { history.replaceState(null, "", location.pathname); toast(P.get("connected") === "instagram" || P.get("connected") === "facebook" ? "Connected." : "Connected."); return go("connect"); }
      return route(r);
    }
    if (r.error === "not_signed_in") { store.del(); S.token = ""; S.mode = "signin"; S.note = "Please sign in again."; return go("email"); }
    return offlineScreen(r.message);          /* offline / 5xx: keep the token */
  }
  if (P.get("signin") || P.get("done")) { S.mode = "signin"; if (P.get("done")) S.note = "Sign in to finish setting up."; return go("email"); }
  go("intro");
}
window.addEventListener("pagehide", () => { pollStop = true; });
boot();
</script>
