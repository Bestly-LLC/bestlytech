<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#fff3c4" stop-opacity=".55"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></linearGradient></defs><style>
@keyframes tw{0%,100%{opacity:.9}50%{opacity:.12}}
.s{animation:tw 3.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.palm{animation:sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.frond{animation:sway 5s ease-in-out infinite}
@keyframes blink{0%,80%,100%{opacity:0}84%,92%{opacity:1}}
.blink{animation:blink 1.5s steps(1) infinite}.blink2{animation:blink 1.5s steps(1) infinite .75s}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.85}}
.glow{animation:glow 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.plane,.car,.queen{display:none}}

@keyframes drive{0%{transform:translate(-260px,466px) scale(.9)}100%{transform:translate(1460px,466px) scale(.9)}}
.car{animation:drive 13s linear infinite;animation-delay:-3s}
@keyframes fly{0%{transform:translate(-120px,120px) rotate(-6deg) scale(.55)}100%{transform:translate(1330px,40px) rotate(-6deg) scale(.55)}}
.plane{animation:fly 28s linear infinite;animation-delay:-9s}

@keyframes strut{0%{transform:translate(170px,429px) scale(1,1)}47%{transform:translate(720px,429px) scale(1,1)}50%{transform:translate(720px,429px) scale(-1,1)}97%{transform:translate(170px,429px) scale(-1,1)}100%{transform:translate(170px,429px) scale(1,1)}}
.queen{animation:strut 46s linear infinite;animation-delay:-12s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
.qbody{animation:bob .7s ease-in-out infinite}
@keyframes legA{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
@keyframes legB{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.lA{animation:legA .7s ease-in-out infinite;transform-origin:0 -17px}.lB{animation:legB .7s ease-in-out infinite;transform-origin:0 -17px}
@keyframes fan{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(12deg)}}
.fan{animation:fan 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}

@keyframes howl{0%,78%,100%{transform:rotate(0)}82%,94%{transform:rotate(-28deg)}}
.chead{animation:howl 14s ease-in-out infinite;transform-origin:12px -21px}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
.ctail{animation:tail 3s ease-in-out infinite;transform-origin:1px -1px}
</style>
