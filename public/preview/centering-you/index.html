const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(D.s),iterations:D.i,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.v)},key,ub(D.c));
  const html=new TextDecoder().decode(pt);
  try{sessionStorage.setItem('cy_pw',pw)}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const err=document.getElementById('err');err.textContent='Checking…';
  try{await open_(document.getElementById('pw').value)}catch(x){err.textContent='That password didn’t work. Try again.'}
});
(async()=>{let s=null;try{s=sessionStorage.getItem('cy_pw')}catch(e){} if(s){try{await open_(s)}catch(e){}}})();
