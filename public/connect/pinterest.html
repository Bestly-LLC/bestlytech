<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Connect Pinterest · Bestly Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1712;--bone:#EFEAE1;--brass:#A8824B;--mute:#6E6557;--hair:#CEC6B9;--bad:#9A2F22}
*{box-sizing:border-box}html,body{margin:0;background:var(--bone);color:var(--ink)}
body{font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:12vh 20px 56px}
.eb{font:600 12px/1 Inter,-apple-system,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--brass)}
h1{font:400 40px/1.12 "Cormorant Garamond",Georgia,serif;margin:14px 0 18px}
hr{border:0;border-top:1px solid var(--hair);margin:24px 0}
p{margin:0 0 14px}.mute{color:var(--mute);font-size:15px}.bad{color:var(--bad)}
.btn{display:inline-block;background:var(--ink);color:var(--bone);border:0;border-radius:999px;padding:14px 26px;font:600 15px Inter,-apple-system,sans-serif;text-decoration:none;cursor:pointer}
.btn[disabled]{opacity:.5;cursor:default}
input{width:100%;padding:12px 14px;border:1px solid var(--hair);border-radius:10px;background:#fff;font:16px ui-monospace,Menlo,monospace;margin:6px 0 16px;color:var(--ink)}
label{font:600 12px Inter,-apple-system,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
code{font:14px ui-monospace,Menlo,monospace;background:#fff;padding:2px 6px;border-radius:6px;word-break:break-all}
.pg{display:block;width:100%;text-align:left;margin:0 0 10px;background:#fff;color:var(--ink);border:1px solid var(--hair);border-radius:12px;padding:14px 16px;font:600 16px Inter,-apple-system,sans-serif;cursor:pointer}
.pg:hover{border-color:var(--brass)}
</style>

</head><body><main><div class="eb">Bestly Studio</div><div id="out"><h1>One moment.</h1></div></main>
<script>
// Connect a client's Pinterest BUSINESS account to Bestly Studio so the pins they approve go onto one board.
// Talks to the studio-social function; the Pinterest token never reaches this page.
const API = "https://rcqfqhguwpmaarseifqg.supabase.co/functions/v1/studio-social";
const out = document.getElementById("out");
const q = new URLSearchParams(location.search);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WHY = {
  link_not_found: "This link isn't valid. Ask your Bestly contact for a new one.",
  link_used: "This link was already used, so your Pinterest is connected. If you need to reconnect, ask for a new link.",
  link_expired: "This link has expired. Ask your Bestly contact for a new one.",
  wrong_platform: "This link is for a different account. Ask your Bestly contact for a Pinterest one.",
  not_set_up: "Bestly is finishing setup. Try this link again later today.",
  post_permission_missing: "Posting permission wasn't granted. Try again and tap Give access on the Pinterest screen.",
  personal_account: "This is a personal Pinterest account. Posting needs a free Pinterest business account. In Pinterest, open Settings, then Account management, and switch to a business account. It takes about 1&nbsp;minute. Then tap Try again.",
  profile: "Pinterest wouldn't share your account details just now. Try again in a few minutes.",
  board_create: "Pinterest couldn't make the new board. Try again, or pick one of your boards.",
  board_not_found: "That board wasn't in the list. Try again.",
  nothing_pending: "That sign-in ran out. Tap Try again.",
  code_exchange: "Pinterest didn't accept the sign-in. Try again."
};
function say(title, body){ out.innerHTML = `<h1>${title}</h1>${body || ""}`; }
async function call(body){
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json().catch(() => ({ ok: false, error: "unreachable" }));
}
function done(r){
  say("Connected.", `<p><b>${esc(r.handle || "Your Pinterest")}</b> is now connected to Bestly Studio${r.client ? " for " + esc(r.client) : ""}.</p>
    <p class="mute">Pins you approve will go to this board as soon as posting to Pinterest is switched on. Bestly handles that for you. You can disconnect any time from your board.</p>
    <p class="mute">You can close this tab and go back to your board.</p>`);
}
function fail(r, k){
  const retry = k && !(r.error || "").startsWith("link") ? `<p><a class="btn" href="/c/${encodeURIComponent(k)}">Try again</a></p>` : "";
  say("Not connected.", `<p class="bad">${WHY[r.error] || esc("Something went wrong connecting. " + (r.detail || r.error || ""))}</p>${retry}`);
}
(async () => {
  const code = q.get("code"), state = q.get("state"), err = q.get("error_description") || q.get("error");
  if (state && (code || err)) {
    history.replaceState(null, "", location.pathname);
    if (err) return say("Not connected.", `<p>Pinterest said: ${esc(err)}</p><p><a class="btn" href="/c/${encodeURIComponent(state)}">Try again</a></p>`);
    say("Connecting.");
    const r = await call({ op: "pin_finish", k: state, code });
    if (r.ok && r.pick_board) {
      const mk = (r.client || "Centering YOU");
      say("Which board?", `<p>Pick the board your pins should go on, or let Bestly Studio make a new one.</p>`
        + r.pick_board.map(p => `<button class="pg" data-id="${esc(p.id)}">${esc(p.name)}</button>`).join("")
        + `<hr><button class="pg" data-new="${esc(mk)}">Make a new board called ${esc(mk)}</button>`);
      out.querySelectorAll(".pg").forEach(b => b.onclick = async () => {
        out.querySelectorAll(".pg").forEach(x => x.disabled = true);
        const f = await call(b.dataset.new ? { op: "pin_pick", k: state, new_board_name: b.dataset.new } : { op: "pin_pick", k: state, board_id: b.dataset.id });
        f.ok ? done(f) : fail(f, state);
      });
      return;
    }
    return r.ok ? done(r) : fail(r, state);
  }
  const k = q.get("k");
  if (!k) return say("Nothing to connect.", `<p class="mute">Open the link your Bestly contact sent you.</p>`);
  const r = await call({ op: "pin_start", k });
  if (!r.ok) return say(r.error === "link_used" ? "Already connected." : "Can't connect yet.", `<p>${esc(WHY[r.error] || r.error)}</p>`);
  say(`Connect Pinterest${r.client ? " for " + esc(r.client) : ""}`,
    `<p>Bestly Studio will pin the content you approve to one of your Pinterest boards, at the time on your calendar. You stay in control: you can pause or disconnect any time from your board.</p>
     <p class="mute">You need a Pinterest business account (it's free). Log in, then tap Give access. Next you will pick a board.</p><hr>
     <p><a class="btn" href="${esc(r.authorize_url)}">Continue to Pinterest</a></p>`);
})();
</script></body></html>
