<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" color="#fff">
<style>
.st{fill:none;stroke:currentColor;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.fl{fill:currentColor}
.look,.lidL,.lidR{transform-box:view-box}
.look{animation:look 4.2s cubic-bezier(.45,1.5,.5,1) infinite}
.lidL,.lidR{animation:lid 4.2s cubic-bezier(.4,1.35,.5,1) infinite}
.lidL{transform-origin:19px 42px}.lidR{transform-origin:53px 42px}
@keyframes look{
 0%,10%{transform:translate(0,0)}
 18%{transform:translate(0,1.5px)}
 26%,46%{transform:translate(-5.4px,3px)}
 54%,74%{transform:translate(5.4px,3px)}
 82%,100%{transform:translate(0,0)}}
@keyframes lid{
 0%,8%{transform:translateY(-13px) rotate(0)}
 18%,22%{transform:translateY(-2.5px) rotate(0)}
 28%,46%{transform:translateY(-.8px) rotate(-9deg)}
 54%{transform:translateY(-2.5px) rotate(0)}
 60%,74%{transform:translateY(-.8px) rotate(9deg)}
 82%{transform:translateY(-15px) rotate(0)}
 87%{transform:translateY(-13px) rotate(0)}
 91%{transform:translateY(14px) rotate(0)}
 95%,100%{transform:translateY(-13px) rotate(0)}}
@media (prefers-reduced-motion:reduce){.look,.lidL,.lidR{animation:none}.lidL,.lidR{transform:translateY(-.8px) rotate(-9deg)}.look{transform:translate(-5.4px,3px)}}
</style>
<defs>
<mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="72" height="72"><rect width="72" height="72" fill="#fff"/><circle cx="19" cy="44" r="10.3"/><circle cx="53" cy="44" r="10.3"/></mask>
<clipPath id="cl"><circle cx="19" cy="44" r="10.7"/></clipPath>
<clipPath id="cr"><circle cx="53" cy="44" r="10.7"/></clipPath>
<mask id="pm" maskUnits="userSpaceOnUse" x="0" y="0" width="72" height="72"><rect width="72" height="72" fill="#fff"/><g class="lidL"><rect x="0" y="10" width="40" height="34.8"/></g><g class="lidR"><rect x="32" y="10" width="40" height="34.8"/></g></mask>
</defs>
<g mask="url(#m)"><path class="st" d="M9 37L13.5 21Q14 18 17 18H21Q24 18 24.5 21L29 37M43 37L47.5 21Q48 18 51 18H55Q58 18 58.5 21L63 37"/><path class="st" d="M25.5 27H46.5M30 42H42"/></g>
<circle class="st" cx="19" cy="44" r="13"/><circle class="st" cx="53" cy="44" r="13"/>
<g mask="url(#pm)"><g class="look"><circle class="fl" cx="19" cy="44" r="4.8"/><circle class="fl" cx="53" cy="44" r="4.8"/></g></g>
<g clip-path="url(#cl)"><g class="lidL"><rect class="fl" x="0" y="10" width="40" height="32"/></g></g>
<g clip-path="url(#cr)"><g class="lidR"><rect class="fl" x="32" y="10" width="40" height="32"/></g></g>
</svg>
