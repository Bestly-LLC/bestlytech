plugins {
    id 'com.android.application'
}

android {
    namespace 'tech.bestly.wall'
    compileSdk 34

    defaultConfig {
        applicationId 'tech.bestly.wall'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // sideloaded only; the same Mac key signs every update
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
}
