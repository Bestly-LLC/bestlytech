<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:S;src:url(serif700.woff2);font-weight:700}
@font-face{font-family:S;src:url(serif600.woff2);font-weight:600}
@font-face{font-family:I;src:url(inter400.woff2);font-weight:400}
@font-face{font-family:I;src:url(inter600.woff2);font-weight:600}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1080px;overflow:hidden}
.c{position:relative;width:1080px;height:1080px;overflow:hidden;color:#fff;
 background:radial-gradient(circle at 92% 62%, #232b5c 0%, #151a38 30%, #0b0c18 62%, #08080c 100%)}
.pill{position:absolute;left:70px;top:48px;width:242px}
.cat{position:absolute;right:76px;top:80px;font:600 21px I;letter-spacing:.24em;color:#8a8fa8;text-transform:uppercase}
.dev{position:absolute;pointer-events:none}
.txt{position:absolute;left:76px;right:76px}
.kick{font:600 21px I;letter-spacing:.2em;color:#8b9bf0;text-transform:uppercase;margin-bottom:28px}
h1{font:700 var(--hs,88px)/1.1 S;letter-spacing:-.01em;color:#fff;text-wrap:balance}
h1 em{font-style:normal;color:#8b9bf0;white-space:nowrap}
.txt,.cat,.pill,.foot,.swipe{z-index:2}
.dev{z-index:1}
.bar{width:220px;height:9px;background:#8b9bf0;margin:36px 0 34px}
p{font:400 31px/1.45 I;color:#9ea6bc;max-width:var(--pw,860px)}
.foot{position:absolute;left:76px;bottom:62px;font:400 23px I;color:#c9cde0;display:flex;align-items:center;gap:12px}
.foot:before{content:"";width:10px;height:10px;border-radius:50%;background:#8b9bf0}
.swipe{position:absolute;left:76px;bottom:120px;font:600 26px I;color:#c9cde0}
.num{position:absolute;right:-10px;bottom:-90px;font:700 520px/1 I;color:rgba(139,155,240,.06)}
</style></head><body><div class="c" id="c"></div>
<script>
const d = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const c = document.getElementById('c');
let h = `<img class="pill" src="pill.png">`;
if (d.cat) h += `<div class="cat">${d.cat}</div>`;
if (d.num) h += `<div class="num">${d.num}</div>`;
if (d.dev) h += `<img class="dev" src="${d.dev.src}" style="${d.dev.style}">`;
h += `<div class="txt" style="${d.pos}">${d.kick?`<div class="kick">${d.kick}</div>`:''}<h1 style="--hs:${d.hs||88}px">${d.h}</h1><div class="bar"></div>${d.p?`<p style="--pw:${d.pw||860}px">${d.p}</p>`:''}</div>`;
if (d.swipe) h += `<div class="swipe">Swipe &rarr;</div>`;
h += `<div class="foot">bestly.tech</div>`;
c.innerHTML = h;
document.fonts.ready.then(()=>{ window.DONE = true; });
</script></body></html>
