# Bestly Voice (W7): the NZXT MINI USB MIC by its ALSA card name ("MIC"), not its index, so it survives reboots and replugs.
# dsnoop so a test recording can run next to the voice service; plug converts to 48 kHz mono S16 (voice.py then
# low-pass filters and decimates to 16 kHz itself). The mic's only native format is S24_3LE, 2 ch, 48 kHz.
pcm.scoutmic_share {
    type dsnoop
    ipc_key 57831
    ipc_perm 0666
    slave {
        pcm "hw:CARD=MIC,DEV=0"
        format S24_3LE
        rate 48000
        channels 2
    }
}
pcm.scoutmic {
    type plug
    slave.pcm "scoutmic_share"
}
