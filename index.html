<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Bestly — Stop renting your business from big tech</title>
    <meta name="description" content="Bestly builds private cloud servers for businesses, plus privacy-first apps, browser extensions, and consumer hardware. One server in your office replaces Google Workspace, Slack, Zoom, Dropbox, DocuSign, 1Password, and your AI tool. Built in Los Angeles." />
    <meta name="author" content="Bestly LLC" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.bestly.tech/" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://rcqfqhguwpmaarseifqg.supabase.co" crossorigin />
    <!-- Cookie Yeti marketing type: Fredoka (playful display) + Nunito (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- 3D hero: start the model download during HTML parse + warm the draco decoder host -->
    <link rel="preload" href="/models/device-web-split.glb" as="fetch" type="model/gltf-binary" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bestly" />
    <meta property="og:url" content="https://www.bestly.tech/" />
    <meta property="og:title" content="Bestly — Stop renting your business from big tech" />
    <meta property="og:description" content="Private cloud for your office. Apps that don't sell your data. Extensions that block surveillance. Built in Los Angeles." />
    <meta property="og:image" content="https://www.bestly.tech/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.bestly.tech/" />
    <meta name="twitter:title" content="Bestly — Stop renting your business from big tech" />
    <meta name="twitter:description" content="Private cloud for your office. Apps that don't sell your data. Extensions that block surveillance. Built in Los Angeles." />
    <meta name="twitter:image" content="https://www.bestly.tech/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Bestly LLC",
        "url": "https://www.bestly.tech",
        "logo": "https://www.bestly.tech/favicon.png",
        "description": "Bestly builds private cloud servers for businesses, plus privacy-first apps, browser extensions, and consumer hardware. Built in Los Angeles."
      }
    </script>
    <!-- Boot splash: the Bestly mark is on screen before any JS loads (React replaces #root's contents on mount). -->
    <link rel="preload" href="/bestly-mark.webp" as="image" type="image/webp" fetchpriority="high" />
    <style>
      #boot-splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fbfaf8;z-index:2147483647}
      #boot-splash.is-admin{background:#000}
      #boot-splash .mark{width:96px;height:96px;display:flex;align-items:center;justify-content:center;animation:boot-breathe 1.6s cubic-bezier(.4,0,.2,1) infinite}
      #boot-splash.is-admin .mark{width:112px;height:112px;animation:none}
      #boot-splash img{width:84px;height:84px}
      #boot-splash.is-admin img{width:112px;height:112px}
      @keyframes boot-breathe{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
      @media (prefers-reduced-motion:reduce){#boot-splash .mark{animation:none}}
    </style>
  </head>

  <body>
    <div id="root"><div id="boot-splash" role="status" aria-label="Loading Bestly"><div class="mark"><img src="/bestly-mark.webp" alt="" width="64" height="64" /></div></div></div>
    <script>
      if (location.pathname.indexOf("/admin") === 0) {
        document.getElementById("boot-splash").className = "is-admin";
        document.querySelector("#boot-splash img").src = "/admin-mark.svg";
        document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]').forEach(function (l) {
          l.setAttribute("data-site-href", l.getAttribute("href"));
          l.href = l.rel === "apple-touch-icon" ? "/admin-apple-touch-icon.png" : l.type === "image/x-icon" ? "/admin-favicon.ico" : "/admin-favicon-512.png";
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
